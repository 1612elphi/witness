<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Witness</title>
    <script>
      // Apply the persisted Beam theme before paint to avoid a flash; default
      // stays light (set on <html>) when the visitor has no saved preference.
      (function () {
        try {
          var m = document.cookie.match(/(?:^|; )sunbeam-theme=([^;]*)/);
          var v = m ? decodeURIComponent(m[1]) : localStorage.getItem("sunbeam-theme");
          if (v === "light" || v === "dark") {
            document.documentElement.setAttribute("data-theme", v);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
